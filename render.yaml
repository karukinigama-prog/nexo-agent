services:
  - type: web
    name: nexo-ai-agent
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: python main.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: RENDER
        value: true
      - key: PYTHONUNBUFFERED
        value: true
